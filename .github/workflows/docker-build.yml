name: Build and Push to Docker Hub

# 两种触发方式：
# 1. 推送 master 分支
# 2. 手动运行
on:
  push:
    branches:
      - master
    paths-ignore:
      - "**.md"
      - "docs/**"
      - ".github/**"

  workflow_dispatch:
    inputs:
      version_tag:
        description: "手动指定镜像版本，格式 vx.x.x（如 v2.0.4）"
        required: true
        default: "v2.0.10"

jobs:
  build:
    runs-on: ubuntu-latest

    # 自动 push：
    # 只有 commit message 以 v 开头才执行
    # 手动触发：
    # 无条件执行
    if: ${{ github.event_name == 'workflow_dispatch' || startsWith(github.event.head_commit.message, 'v') }}

    steps:
      # 拉取代码
      - name: 拉取代码
        uses: actions/checkout@v4

      # 设置 QEMU，用于构建 ARM64 镜像
      - name: 设置 QEMU
        uses: docker/setup-qemu-action@v3

      # 设置 Docker Buildx
      - name: 设置 Docker Buildx
        uses: docker/setup-buildx-action@v3

      # 登录 Docker Hub
      - name: 登录 Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_HUB_USERNAME }}
          password: ${{ secrets.DOCKER_HUB_TOKEN }}

      # 解析最终版本 tag
      # 手动触发：使用输入的 version_tag
      # 自动触发：从 commit message 第一行第一个字段读取版本号
      - name: 解析版本标签
        id: vars
        env:
          EVENT_NAME: ${{ github.event_name }}
          INPUT_VERSION_TAG: ${{ github.event.inputs.version_tag }}
          COMMIT_MESSAGE: ${{ github.event.head_commit.message }}
        shell: bash
        run: |
          set -e

          if [[ "$EVENT_NAME" == "workflow_dispatch" ]]; then
            tag="$INPUT_VERSION_TAG"
          else
            first_line="${COMMIT_MESSAGE%%$'\n'*}"
            tag="${first_line%%[[:space:]]*}"
          fi

          # 校验版本格式：必须为 vX.X.X
          if ! [[ "$tag" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::版本格式非法：$tag，必须为 vX.X.X 格式，例如 v2.0.7"
            exit 1
          fi

          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "最终使用镜像版本: $tag"

      # 构建并推送 Docker Hub
      - name: 构建并推送多架构镜像
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true

          tags: |
            ${{ secrets.DOCKER_HUB_USERNAME }}/netease-musician-task:${{ steps.vars.outputs.tag }}
            ${{ secrets.DOCKER_HUB_USERNAME }}/netease-musician-task:latest

          cache-from: type=gha
          cache-to: type=gha,mode=max
